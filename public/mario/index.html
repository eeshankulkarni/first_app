<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Mario - Browser Edition</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="hud">
        <h1>Mini Mario (No Ruby Required)</h1>
        <div class="stats">
          <span id="score">Score: 0</span>
          <span id="coins">Coins: 0/8</span>
          <span id="lives">Lives: 3</span>
          <span id="status">Status: Running</span>
        </div>
        <p>Controls: ← → move, Space jump, R restart.</p>
      </header>
      <canvas id="game" width="960" height="540" aria-label="Mario style game"></canvas>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
